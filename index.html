<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Q2 Drill 1</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

	<style>
		body {
			background-color: #f0f4f8;
			padding: 20px;
		}
		.sports-banner {
			background-color: #000080;
			border-radius: 12px;
			padding: 40px 20px;
			box-shadow: 0px 4px 15px;
		}
		.header-title-bar {
			background-color: white;
			border-radius: 50px;
			padding: 12px;
			box-shadow: 0px 5px 10px;
			max-width: 850px;
			margin: 0 auto 30px auto;
		}
		.header-title-bar h2 {
			font-size: 24px;
			font-weight: bold;
			margin: 0;
			color: black;
		}
		.center-graphic {
			max-width: 180px;
			margin: 0 auto 40px auto;
			display: block;
		}
		.info-card {
			background-color: white;
			border-radius: 8px;
			overflow: hidden;
			box-shadow: 0px 6px 12px;
			min-height: 180px;
		}
		.card-top-bar {
			background-color: #E2FF54;
			padding: 8px 15px;
			font-weight: bold;
			font-size: 16px;
			color: #222;
			border-bottom: 1px solid #ddd;
		}
		.card-body-text {
			padding: 15px;
		}
		.card-body-text ul {
			padding-left: 20px;
			margin: 0;
			font-size: 14px;
			color: #333;
		}
		.card-body-text li {
			margin-bottom: 5px;
		}
	</style>
</head>
<body>

	<div class="container my-4">
		
		<div class="sports-banner text-center">
			
			<div class="header-title-bar">
				<h2>Beginner's Guide to Pickleball</h2>
			</div>

			<img src="pickleball.png" alt="Pickleball Paddle and Ball" class="center-graphic">

			<div class="row g-4 justify-content-center text-start">
				<div class="col-md-4">
					<div class="info-card">
						<div class="card-top-bar">Basic Rules</div>
						<div class="card-body-text">
							<ul>
								<li>Serve diagonally</li>
								<li>Double bounce rule</li>
								<li>No volley zone</li>
								<li>Scoring</li>
							</ul>
						</div>
					</div>
				</div>


				<div class="col-md-4">
					<div class="info-card">
						<div class="card-top-bar">Pickleball Equipment</div>
						<div class="card-body-text">
							<ul>
								<li>Paddle</li>
								<li>Plastic ball</li>
								<li>Net</li>
								<li>Court</li>
							</ul>
						</div>
					</div>
				</div>

				
				<div class="col-md-4">
					<div class="info-card">
						<div class="card-top-bar">Basic Techniques</div>
						<div class="card-body-text">
							<ul>
								<li>Forehand and backhand strokes</li>
								<li>Serving techniques</li>
								<li>Dinking</li>
								<li>Positioning</li>
							</ul>
						</div>
					</div>
				</div>

			</div>

		</div>

	</div>

</body>
</html>
